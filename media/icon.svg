<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa657"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#30363d" stroke-width="3"/>

  <!-- Graph Orbit rings / Atlas Latitude rings -->
  <ellipse cx="64" cy="64" rx="46" ry="46" fill="none" stroke="#21262d" stroke-width="2"/>
  <ellipse cx="64" cy="64" rx="46" ry="20" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <ellipse cx="64" cy="64" rx="22" ry="46" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Connecting Graph Edges -->
  <line x1="64" y1="28" x2="34" y2="52" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="64" y1="28" x2="94" y2="52" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="34" y1="52" x2="44" y2="88" stroke="#3fb950" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="94" y1="52" x2="84" y2="88" stroke="#bc8cff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="44" y1="88" x2="84" y2="88" stroke="#d29922" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="34" y1="52" x2="64" y2="64" stroke="#58a6ff" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="94" y1="52" x2="64" y2="64" stroke="#bc8cff" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="44" y1="88" x2="64" y2="64" stroke="#3fb950" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="84" y1="88" x2="64" y2="64" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="64" y1="28" x2="64" y2="64" stroke="#58a6ff" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- Graph Nodes -->
  <!-- Center Core Node -->
  <circle cx="64" cy="64" r="10" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>

  <!-- North Node (Root / Class) -->
  <circle cx="64" cy="28" r="8" fill="url(#purpleGrad)"/>
  <circle cx="64" cy="28" r="3.5" fill="#ffffff"/>

  <!-- West Node (Function) -->
  <circle cx="34" cy="52" r="7" fill="url(#greenGrad)"/>
  <circle cx="34" cy="52" r="3" fill="#ffffff"/>

  <!-- East Node (Module) -->
  <circle cx="94" cy="52" r="7" fill="url(#cyanGrad)"/>
  <circle cx="94" cy="52" r="3" fill="#ffffff"/>

  <!-- South-West Node (Dependency) -->
  <circle cx="44" cy="88" r="7" fill="url(#orangeGrad)"/>
  <circle cx="44" cy="88" r="3" fill="#ffffff"/>

  <!-- South-East Node (Impact Leaf) -->
  <circle cx="84" cy="88" r="7" fill="url(#purpleGrad)"/>
  <circle cx="84" cy="88" r="3" fill="#ffffff"/>
</svg>
